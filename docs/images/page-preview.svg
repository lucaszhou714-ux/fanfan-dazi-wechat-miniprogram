<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">饭饭搭子四个主要页面预览</title><desc id="desc">今天、记录、发现、我们四个手机页面的视觉示意。</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffaf8"/><stop offset="1" stop-color="#f6e8e4"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5b3b34" flood-opacity=".17"/></filter></defs>
  <rect width="1400" height="760" rx="32" fill="url(#bg2)"/><text x="700" y="50" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="31" font-weight="700" fill="#352c29">四个一级页面 · 界面示意</text>
  <g font-family="Arial,'Microsoft YaHei',sans-serif" filter="url(#s)">
    <g transform="translate(58 86)"><rect width="285" height="610" rx="38" fill="#fff8f6" stroke="#342d2b" stroke-width="8"/><text x="143" y="35" text-anchor="middle" font-size="12">12:18</text><text x="25" y="78" font-size="13" fill="#9b8a83">8 月 8 日 · 星期六</text><text x="25" y="115" font-size="25" font-weight="700">中午吃什么？</text><text x="25" y="140" font-size="12" fill="#8e7e77">少纠结一点，把时间留给好好吃饭</text><rect x="20" y="165" width="245" height="190" rx="26" fill="#ffe4df"/><text x="40" y="197" font-size="12" fill="#8e7e77">今天的午餐</text><text x="40" y="245" font-size="31" font-weight="700">还没决定</text><text x="40" y="274" font-size="12" fill="#9f7e76">预算 ¥35 · 不吃香菜</text><rect x="40" y="294" width="205" height="44" rx="22" fill="#ee7167"/><text x="143" y="322" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">帮我决定</text><rect x="20" y="375" width="245" height="88" rx="22" fill="#fff"/><text x="38" y="405" font-size="12" fill="#95857e">TA 今天吃了</text><text x="38" y="437" font-size="19" font-weight="700">番茄牛腩饭</text><text x="235" y="430" text-anchor="middle" font-size="28">🍅</text><rect x="20" y="480" width="245" height="80" rx="22" fill="#fff"/><text x="38" y="513" font-size="16" font-weight="700">留下这一餐</text><text x="38" y="539" font-size="11" fill="#95857e">拍照或写一句话，20 秒完成</text><text x="143" y="652" text-anchor="middle" font-size="16" font-weight="700" fill="#e66e64">今天</text></g>
    <g transform="translate(391 86)"><rect width="285" height="610" rx="38" fill="#fff8f6" stroke="#342d2b" stroke-width="8"/><text x="143" y="35" text-anchor="middle" font-size="12">12:18</text><text x="25" y="83" font-size="25" font-weight="700">我们的饭饭记录</text><text x="25" y="108" font-size="12" fill="#8e7e77">每一顿，都是两个人的小日常</text><rect x="20" y="135" width="115" height="75" rx="20" fill="#fff"/><rect x="150" y="135" width="115" height="75" rx="20" fill="#fff"/><text x="78" y="166" text-anchor="middle" font-size="22">📷</text><text x="78" y="193" text-anchor="middle" font-size="13">拍照记录</text><text x="208" y="166" text-anchor="middle" font-size="22">✍</text><text x="208" y="193" text-anchor="middle" font-size="13">文字记录</text><rect x="20" y="230" width="245" height="72" rx="20" fill="#fff"/><text x="38" y="260" font-size="16" font-weight="700">本周回顾</text><text x="38" y="284" font-size="11" fill="#95857e">记录 5 天 · 外卖 3 次</text><line x1="42" y1="328" x2="42" y2="548" stroke="#efc8c3" stroke-width="3"/><circle cx="42" cy="355" r="7" fill="#eb8077"/><text x="61" y="351" font-size="12" fill="#e16d63">我 · 今天 12:10</text><text x="61" y="380" font-size="18" font-weight="700">黄焖鸡米饭</text><rect x="61" y="395" width="74" height="24" rx="12" fill="#ffe7e3"/><text x="98" y="412" text-anchor="middle" font-size="10" fill="#d25b51">有蛋白质</text><circle cx="42" cy="463" r="7" fill="#eb8077"/><text x="61" y="459" font-size="12" fill="#e16d63">TA · 昨天 18:32</text><text x="61" y="488" font-size="18" font-weight="700">螺蛳粉</text><text x="61" y="513" font-size="11" fill="#95857e">终于吃到想了两天的那家</text><text x="143" y="652" text-anchor="middle" font-size="16" font-weight="700" fill="#e66e64">记录</text></g>
    <g transform="translate(724 86)"><rect width="285" height="610" rx="38" fill="#fff8f6" stroke="#342d2b" stroke-width="8"/><text x="143" y="35" text-anchor="middle" font-size="12">12:18</text><text x="25" y="83" font-size="25" font-weight="700">发现新味道</text><text x="25" y="108" font-size="12" fill="#8e7e77">偶尔换换口味，也可以一起学做饭</text><rect x="20" y="135" width="245" height="135" rx="24" fill="#453936"/><text x="38" y="165" font-size="11" fill="#dfd1cc">本周尝鲜主题 · 周一更新</text><text x="38" y="205" font-size="27" font-weight="700" fill="#fff">清淡一点周</text><text x="38" y="235" font-size="12" fill="#e5d8d4">试试蒸菜、汤饭和时蔬搭配</text><text x="25" y="312" font-size="18" font-weight="700">适合带饭</text><rect x="20" y="332" width="115" height="145" rx="20" fill="#fff"/><rect x="150" y="332" width="115" height="145" rx="20" fill="#fff"/><text x="78" y="382" text-anchor="middle" font-size="38">🍅</text><text x="78" y="420" text-anchor="middle" font-size="15" font-weight="700">番茄牛腩</text><text x="78" y="445" text-anchor="middle" font-size="10" fill="#95857e">50 分钟 · 简单</text><text x="208" y="382" text-anchor="middle" font-size="38">🍄</text><text x="208" y="420" text-anchor="middle" font-size="15" font-weight="700">香菇滑鸡</text><text x="208" y="445" text-anchor="middle" font-size="10" fill="#95857e">30 分钟 · 简单</text><text x="25" y="518" font-size="18" font-weight="700">15 分钟快手菜</text><text x="143" y="652" text-anchor="middle" font-size="16" font-weight="700" fill="#e66e64">发现</text></g>
    <g transform="translate(1057 86)"><rect width="285" height="610" rx="38" fill="#fff8f6" stroke="#342d2b" stroke-width="8"/><text x="143" y="35" text-anchor="middle" font-size="12">12:18</text><text x="25" y="83" font-size="25" font-weight="700">我们</text><text x="25" y="108" font-size="12" fill="#8e7e77">一起吃饭，也一起记录生活</text><rect x="20" y="135" width="245" height="168" rx="24" fill="#ffebe8"/><circle cx="85" cy="186" r="31" fill="#ffd9d4"/><circle cx="200" cy="186" r="31" fill="#ffd9d4"/><text x="85" y="193" text-anchor="middle" font-size="15">我</text><text x="143" y="194" text-anchor="middle" font-size="23" fill="#e76d63">♥</text><text x="200" y="193" text-anchor="middle" font-size="15">TA</text><text x="143" y="244" text-anchor="middle" font-size="20" font-weight="700">我爱的 TA</text><text x="143" y="275" text-anchor="middle" font-size="13" fill="#8e7e77">我们来到这里的第 <tspan fill="#e66e64" font-size="20" font-weight="700">100</tspan> 天</text><rect x="20" y="323" width="245" height="105" rx="22" fill="#fff0ed"/><text x="143" y="350" text-anchor="middle" font-size="11" fill="#95857e">本周情侣奖励</text><text x="143" y="383" text-anchor="middle" font-size="18" font-weight="700" fill="#d45d53">周末一起吃大餐</text><text x="25" y="468" font-size="18" font-weight="700">饭饭设置</text><rect x="20" y="485" width="245" height="80" rx="22" fill="#fff"/><text x="38" y="517" font-size="14">我的口味与预算</text><text x="38" y="546" font-size="14">情侣空间与共享</text><text x="143" y="652" text-anchor="middle" font-size="16" font-weight="700" fill="#e66e64">我们</text></g>
  </g>
</svg>
