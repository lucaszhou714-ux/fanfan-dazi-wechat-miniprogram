<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">饭饭搭子产品功能地图</title><desc id="desc">展示今天、记录、发现、我们四个一级功能模块及云同步能力。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8f6"/><stop offset="1" stop-color="#ffe8e4"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9c6158" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="690" rx="34" fill="url(#bg)"/>
  <text x="600" y="62" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="34" font-weight="700" fill="#352c29">饭饭搭子 · 产品功能地图</text>
  <text x="600" y="96" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#8c7b75">决定吃什么 → 留下这一餐 → 一起回顾与发现</text>
  <g filter="url(#shadow)" font-family="Arial,'Microsoft YaHei',sans-serif">
    <g transform="translate(55 145)"><rect width="255" height="365" rx="28" fill="#fff"/><circle cx="48" cy="50" r="25" fill="#ffe3df"/><text x="48" y="58" text-anchor="middle" font-size="24">⌂</text><text x="84" y="58" font-size="28" font-weight="700" fill="#3a302d">今天</text><text x="28" y="100" font-size="15" fill="#9a8982">现在该吃什么？</text><rect x="25" y="127" width="205" height="66" rx="18" fill="#f0786e"/><text x="128" y="168" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">帮我决定</text><text x="28" y="235" font-size="17" fill="#514541">• 今日计划</text><text x="28" y="274" font-size="17" fill="#514541">• 菜品图片与预算</text><text x="28" y="313" font-size="17" fill="#514541">• 每日三次选择</text><text x="28" y="352" font-size="17" fill="#514541">• TA 今日状态</text></g>
    <g transform="translate(335 145)"><rect width="255" height="365" rx="28" fill="#fff"/><circle cx="48" cy="50" r="25" fill="#ffe3df"/><text x="48" y="58" text-anchor="middle" font-size="22">▤</text><text x="84" y="58" font-size="28" font-weight="700" fill="#3a302d">记录</text><text x="28" y="100" font-size="15" fill="#9a8982">我们最近吃了什么？</text><rect x="25" y="127" width="96" height="66" rx="18" fill="#fff0ed"/><rect x="134" y="127" width="96" height="66" rx="18" fill="#fff0ed"/><text x="73" y="168" text-anchor="middle" font-size="17" fill="#d45e53">拍照</text><text x="182" y="168" text-anchor="middle" font-size="17" fill="#d45e53">文字</text><text x="28" y="235" font-size="17" fill="#514541">• 双人饮食时间线</text><text x="28" y="274" font-size="17" fill="#514541">• 详细补记与标签</text><text x="28" y="313" font-size="17" fill="#514541">• 可见范围与花费</text><text x="28" y="352" font-size="17" fill="#514541">• 本周饮食回顾</text></g>
    <g transform="translate(615 145)"><rect width="255" height="365" rx="28" fill="#fff"/><circle cx="48" cy="50" r="25" fill="#ffe3df"/><text x="48" y="58" text-anchor="middle" font-size="23">◇</text><text x="84" y="58" font-size="28" font-weight="700" fill="#3a302d">发现</text><text x="28" y="100" font-size="15" fill="#9a8982">想换口味或自己做？</text><rect x="25" y="127" width="205" height="66" rx="18" fill="#453936"/><text x="128" y="156" text-anchor="middle" font-size="13" fill="#dfd1cc">本周尝鲜主题</text><text x="128" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">清淡一点周</text><text x="28" y="235" font-size="17" fill="#514541">• 场景化菜谱分类</text><text x="28" y="274" font-size="17" fill="#514541">• 食材与步骤</text><text x="28" y="313" font-size="17" fill="#514541">• 做饭小贴士</text><text x="28" y="352" font-size="17" fill="#514541">• 菜谱收藏</text></g>
    <g transform="translate(895 145)"><rect width="255" height="365" rx="28" fill="#fff"/><circle cx="48" cy="50" r="25" fill="#ffe3df"/><text x="48" y="58" text-anchor="middle" font-size="22" fill="#e66e64">♥</text><text x="84" y="58" font-size="28" font-weight="700" fill="#3a302d">我们</text><text x="28" y="100" font-size="15" fill="#9a8982">两个人如何共同使用？</text><rect x="25" y="127" width="205" height="66" rx="18" fill="#ffebe8"/><text x="128" y="156" text-anchor="middle" font-size="13" fill="#9b7770">我爱的 TA</text><text x="128" y="181" text-anchor="middle" font-size="19" font-weight="700" fill="#d45e53">相伴第 100 天</text><text x="28" y="235" font-size="17" fill="#514541">• 邀请与双人绑定</text><text x="28" y="274" font-size="17" fill="#514541">• 相伴天数</text><text x="28" y="313" font-size="17" fill="#514541">• 每周情侣奖励</text><text x="28" y="352" font-size="17" fill="#514541">• 偏好、共享与隐私</text></g>
  </g>
  <path d="M180 550 C180 600 420 610 600 610 C780 610 1020 600 1020 550" fill="none" stroke="#eaa9a2" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="420" y="580" width="360" height="70" rx="35" fill="#fff" stroke="#f1cac5" stroke-width="2"/><text x="600" y="609" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#4b3f3b">微信云开发 · 双账号状态同步</text><text x="600" y="634" text-anchor="middle" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="14" fill="#8c7b75">云函数 · 云数据库 · 云存储</text>
</svg>
